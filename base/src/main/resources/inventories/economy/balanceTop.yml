# |                        General                       | #
# +------------------------------------------------------+ #
############################################################

# Here you can customize the items used for the player ranking in the balance top inventory.
# The key of each item is the slot number where the item will be placed in the inventory.
#
# Placeholders: {playerName_#}, {playerBalance_#}
#   - {playerName_#}: Replace '#' with the rank number to display the player's rank (e.g., {playerName_1} for the 1st place).
#
# Reminder: In theory, you can add up to 54 ranking items, but it is not recommended to avoid cluttering the inventory.
rankingItems:
  21:
    material: "DIAMOND_HELMET"
    displayName: "&b&l1st Place"
    lore:
      - "&7Congratulations to &3{playerName_1} &7for being"
      - "&7the richest player on the server!"
      - "&7Total Balance: &3{playerBalance_1}"
