############################################################
# +------------------------------------------------------+ #
# |                      Information                     | #
# +------------------------------------------------------+ #
############################################################

# This is the messages file for EssentialsX-GUI.

# If you need help with the configuration of the plugin,
# you can join our discord server at: https://discord.gg/fSzK79TAYf

# For more translations,
# check our Wiki at: https://sniper-tvmc.gitbook.io/essentialsx-gui/configuration/messages

# Note about PlaceholderAPI :
#   EssentialsX-GUI supports PlaceholderAPI placeholders in messages.
#   You can use any PlaceholderAPI placeholder in the messages, and they will be parsed correctly.
#   For example, you can use %player_name% to display the player's name in a message.

#   A list of officially supported placeholders can be found on the PlaceholderAPI wiki:
#   - https://wiki.placeholderapi.com/users/placeholder-list/minecraft/
#
#   ⚠️ This is different from the plugin's "placeholders," which are only available in certain messages, when specified.
#      The plugin's “placeholders” are listed in the comments above the relevant messages and should be used with the syntax {placeholderName}.

# Please do not change this value as it may cause the file to be reset.
# Default: "2.0"
fileVersion: "2.0"

############################################################
# +------------------------------------------------------+ #
# |                        General                       | #
# +------------------------------------------------------+ #
############################################################

# Change the prefix sent at the beginning of most sent messages.
# TIP: Use {prefix} in any message to include the prefix.
prefix: "&8[&6&LEXG&8]&7"

############################################################
# +------------------------------------------------------+ #
# |                   Admin Messages                     | #
# +------------------------------------------------------+ #
############################################################

admin:

  # Placeholders available: {currentVersion}, {latestVersion}
  alertUpdateAvailable: "{prefix} &eAn update is available for EssentialsX-GUI. &6Please check the console for more information."

  pluginReloading: "{prefix} &eThe plugin is being reloaded..."
  # Placeholders available: {errors}
  pluginReloaded: "{prefix} &eThe plugin has been reloaded with {errors} error(s)."
  pluginReloadedWithErrors: "{prefix} &6Please check the console for more information."

  filesReloading: "{prefix} &eThe files are being reloaded..."
  # Placeholders available: {errors}
  filesReloaded: "{prefix} &eThe files have been reloaded with {errors} error(s)."

  databaseReloading: "{prefix} &eThe database is being reloaded..."
  # Placeholders available: {errors}
  databaseReloaded: "{prefix} &eThe database has been reloaded with {errors} error(s)."

  tasksReloading: "{prefix} &eThe tasks are being reloaded..."
  # Placeholders available: {errors}
  tasksReloaded: "{prefix} &eThe tasks have been reloaded with {errors} error(s)."

  dataReloading: "{prefix} &eThe data is being reloaded..."
  # Placeholders available: {errors}
  dataReloaded: "{prefix} &eThe data has been reloaded with {errors} error(s)."

############################################################
# +------------------------------------------------------+ #
# |                   Error Messages                     | #
# +------------------------------------------------------+ #
############################################################

errors:

  invalidMaterial: "&cThe material name is invalid."
  invalidNumber: "&cThe input is not a valid number."
  invalidCharacter: "&cThe input contains invalid characters. Please remove any special characters and try again."
  # Placeholders available: {min}, {max}
  lengthLimit: "&cThe input should be between &f{min}&c and &f{max} &ccharacters long."


  # Placeholders available: {argument}
  argumentNotFound: "{prefix} &cThe argument &f{argument} &cwas not found."
  noPermission: "{prefix} &cYou do not have permission to perform this action."
  onlyForPlayers: "{prefix} &cThis command can only be executed by players."
  # Placeholders available: {player}
  playerNotFound: "{prefix} &cThe player &f{player} &cwas not found."
  invalidName: "&cThe name you entered is invalid. Please try again with a different name. (Allowed characters: a-z, A-Z, 0-9, _, -)"
  waitBeforeNextAction: "&cPlease wait before performing another action."

  homeDeleteError: "&cAn error occurred while deleting the home. Please contact the server administrator."
  homeNameAlreadyExists: "&cA home with this name already exists."
  homeLimitReached: "&cYou have reached the maximum number of homes allowed."
  noHomeFound: "&cNo home found with that name."
  itemCantBeAir: "&cThe item cannot be air. Please take an item in your hand and try again."

  kitNameAlreadyExists: "&cA kit with this name already exists."
  noKitFound: "&cNo kit found with that name."
  noKitAccess: "&cYou can't use this kit."

  warpCreationError: "&cAn error occurred while creating the warp. Please contact the server administrator."
  warpDeleteError: "&cAn error occurred while deleting the warp. Please contact the server administrator."
  warpNameAlreadyExists: "&cA warp with this name already exists."
  noWarpFound: "&cNo warp found with that name."
  noWarpAccess: "&cYou can't access this warp."

  noWorthFound: "&cNo items with worth found with that name."
  amountMustBePositive: "&cThe amount must be a positive number."
  # Placeholders available: {maxAmount}
  maxAmountLimit: "&cImpossible to have a balance higher than &f{maxAmount}&c."
  # Placeholders available: {minAmount}
  minAmountLimit: "&cImpossible to have a balance lower than &f{minAmount}&c."
  cantHaveNegativeBalance: "&cThe target player cannot have a negative balance."

