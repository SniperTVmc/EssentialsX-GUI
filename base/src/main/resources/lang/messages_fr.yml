  tasksReloaded: "{prefix} &eLes tâches ont été rechargées avec {errors} erreur(s)."

  dataReloading: "{prefix} &eLes données sont en cours de rechargement..."
  # Placeholders disponibles : {errors}
  dataReloaded: "{prefix} &eLes données ont été rechargées avec {errors} erreur(s)."

