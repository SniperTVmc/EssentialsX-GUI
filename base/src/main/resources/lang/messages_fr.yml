############################################################
# +------------------------------------------------------+ #
# |                    Informations                      | #
# +------------------------------------------------------+ #
############################################################

# Ceci est le fichier de messages en français pour EssentialsX-GUI.
# Contributeurs :
# - Sniper_TVmc

# Si vous avez besoin d'aide avec la configuration du plugin,
# vous pouvez rejoindre notre serveur Discord sur : https://discord.gg/fSzK79TAYf

# Pour plus de traductions,
# consultez notre Wiki sur : https://sniper-tvmc.gitbook.io/essentialsx-gui/configuration/messages

# Note concernant PlaceholderAPI :
#   EssentialsX-GUI prend en charge les placeholders PlaceholderAPI dans les messages.
#   Vous pouvez utiliser n'importe quel placeholder PlaceholderAPI dans les messages, et ils seront analysés correctement.
#   Par exemple, vous pouvez utiliser %player_name% pour afficher le nom du joueur dans un message.

#   Une liste des placeholders officiellement pris en charge se trouve sur le wiki de PlaceholderAPI :
#   - https://wiki.placeholderapi.com/users/placeholder-list/minecraft/
#
#   ⚠️ Ceci est différent des "placeholders" du plugin, qui ne sont disponibles que dans certains messages, lorsque spécifié.
#     Les "placeholders" (variables) du plugin sont listés dans les commentaires au-dessus des messages concernés et
#     doivent être utilisés avec la syntaxe {placeholderName}.

# Veuillez ne pas modifier cette valeur car cela pourrait réinitialiser le fichier.
# Valeur par défaut : "2.0"
fileVersion: "2.0"

############################################################
# +------------------------------------------------------+ #
# |                        Général                       | #
# +------------------------------------------------------+ #
############################################################

# Modifie le préfixe envoyé au début de la plupart des messages.
# CONSEIL : Utilisez {prefix} dans n'importe quel message pour inclure le préfixe.
prefix: "&8[&6&LEXG&8]&7"

############################################################
# +------------------------------------------------------+ #
# |                Messages d'administration             | #
# +------------------------------------------------------+ #
############################################################

admin:

  # Placeholders disponibles : {currentVersion}, {latestVersion}
  alertUpdateAvailable: "{prefix} &eUne mise à jour est disponible pour EssentialsX-GUI. &6Veuillez consulter la console pour plus d'informations."

  pluginReloading: "{prefix} &eLe plugin est en cours de rechargement..."
