  pluginReloaded: "{prefix} &eLe plugin a été rechargé avec {errors} erreur(s)."
  pluginReloadedWithErrors: "{prefix} &6Veuillez consulter la console pour plus d'informations."

  filesReloading: "{prefix} &eLes fichiers sont en cours de rechargement..."
